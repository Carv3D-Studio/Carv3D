name: Bug report
description: Report a reproducible problem in Carv3D
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for the report. Do not attach confidential project files or disclose security vulnerabilities publicly.
  - type: input
    id: version
    attributes:
      label: Carv3D version
      placeholder: For example, 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and browser or desktop version
      placeholder: For example, Windows 11, Edge 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep the steps short and numbered where possible.
      placeholder: |
        1. Open a new project
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Screenshot, error message or small example file without personal data
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked whether this problem has already been reported.
          required: true
        - label: This report contains no confidential information or undisclosed security vulnerability.
          required: true
