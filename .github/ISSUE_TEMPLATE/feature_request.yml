name: Feature request
description: Describe a practical problem or improvement
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would you like to solve?
      description: Describe the practical use case.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Preferred workflow
      description: How should the solution work from your point of view?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Optional example from a 3D printing or maker project
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked whether a similar idea has already been suggested.
          required: true
